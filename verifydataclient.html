<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de tu trámite - DMVCarPortal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #f5f9ff 0%, #eef2fa 100%);
      padding: 40px 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .detail-card {
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      overflow: hidden;
      margin-top: 20px;
    }
    .detail-header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      padding: 30px 40px;
      color: white;
    }
    .detail-header h1 { font-size: 28px; margin-bottom: 5px; }
    .detail-header p { opacity: 0.8; }
    .detail-content { padding: 30px 40px; }
    .grid-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .info-field {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .info-field label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #3b82f6;
      display: block;
      margin-bottom: 5px;
    }
    .info-field span {
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
    }
    .photos-title {
      font-size: 22px;
      font-weight: 800;
      margin: 20px 0 15px;
      color: #1e3a8a;
      border-left: 5px solid #3b82f6;
      padding-left: 15px;
    }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .photo-item {
      background: #f8fafc;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      transition: transform 0.2s;
    }
    .photo-item:hover { transform: translateY(-5px); }
    .photo-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    .photo-caption {
      padding: 10px;
      font-size: 12px;
      text-align: center;
      background: white;
      color: #334155;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      text-decoration: none;
    }
    .btn-back:hover { background: #1d4ed8; }
    @media (max-width: 700px) {
      .grid-2col { grid-template-columns: 1fr; }
      .detail-header, .detail-content { padding: 20px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="detail-card" id="detailCard">
    <div class="detail-header">
      <h1><i class="fas fa-check-circle"></i> Información de tu trámite</h1>
      <p>Datos verificados oficialmente por DMVCarPortal</p>
    </div>
    <div class="detail-content" id="detailContent">
      <div style="text-align: center; padding: 50px;">
        <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: #2563eb;"></i>
        <p>Cargando tu información...</p>
      </div>
    </div>
  </div>
  <div style="text-align: center; margin-top: 30px;">
    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
  </div>
</div>

<script>
  (function() {
    const clienteData = sessionStorage.getItem('clienteData');
    if (!clienteData) {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (id) {
        fetch('data/clientes.json')
          .then(res => res.json())
          .then(clientes => {
            const cliente = clientes[id];
            if (cliente) renderizarCliente(cliente);
            else mostrarError('ID no válido o no encontrado.');
          })
          .catch(() => mostrarError('Error al cargar los datos.'));
      } else {
        mostrarError('No se proporcionó un ID válido.');
      }
    } else {
      const cliente = JSON.parse(clienteData);
      renderizarCliente(cliente);
      sessionStorage.removeItem('clienteData');
    }

    function renderizarCliente(cliente) {
      const container = document.getElementById('detailContent');
      let fotosHtml = '';
      if (cliente.fotos && cliente.fotos.length) {
        fotosHtml = `<div class="photos-title"><i class="fas fa-image"></i> Documentos adjuntos</div>
                     <div class="photos-grid">`;
        cliente.fotos.forEach(fotoUrl => {
          fotosHtml += `
            <div class="photo-item">
              <img src="${fotoUrl}" alt="Documento del cliente" loading="lazy">
              <div class="photo-caption">Documento oficial</div>
            </div>
          `;
        });
        fotosHtml += `</div>`;
      } else {
        fotosHtml = `<div class="photos-title"><i class="fas fa-info-circle"></i> No hay documentos adjuntos</div>`;
      }

      const html = `
        <div class="grid-2col">
          <div class="info-field"><label>Nombre completo</label><span>${cliente.nombre || ''} ${cliente.apellido || ''}</span></div>
          <div class="info-field"><label>ID de trámite</label><span>${cliente.id || ''}</span></div>
          <div class="info-field"><label>Estado del trámite</label><span>${cliente.estado || ''}</span></div>
          <div class="info-field"><label>Ubicación</label><span>${cliente.ubicacion || ''}</span></div>
          <div class="info-field"><label>Fecha de nacimiento</label><span>${cliente.fecha_nacimiento || ''}</span></div>
          <div class="info-field"><label>Plan / Servicio</label><span>${cliente.plan || ''}</span></div>
          <div class="info-field"><label>Tipo de trámite</label><span>${cliente.servicio || ''} - ${cliente.tramite || ''}</span></div>
        </div>
        ${fotosHtml}
      `;
      container.innerHTML = html;
    }

    function mostrarError(mensaje) {
      const container = document.getElementById('detailContent');
      container.innerHTML = `
        <div style="text-align:center; padding:40px;">
          <i class="fas fa-exclamation-triangle" style="font-size: 50px; color: #c0392b;"></i>
          <h2 style="margin: 20px 0 10px;">Error</h2>
          <p>${mensaje}</p>
          <a href="index.html" style="display:inline-block; margin-top:20px; background:#2563eb; color:white; padding:10px 20px; border-radius:30px; text-decoration:none;">Volver al inicio</a>
        </div>
      `;
    }
  })();
</script>
</body>
</html>
